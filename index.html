<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camascope 2.0 — Step-by-Step Training</title>
<style>
  :root{
    --ink:#1c2340; --ink-soft:#4a5273;
    --brand1:#c026d3; --brand2:#7c3aed; --purple:#6d28d9; --purple-dark:#581c87;
    --lilac:#f6f1fb; --card:#fff; --line:#e6ddf2;
    --green:#16a34a; --green-bg:#eaf7ef;
    --amber:#f59e0b; --amber-bg:#fef6e7;
    --red:#dc2626; --red-bg:#fdeeee;
    --blue:#2f6fed; --blue-bg:#eaf1fe;
    --radius:18px; --shadow:0 6px 24px rgba(60,30,110,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:17px}
  body{font-family:Seravek,"Trebuchet MS",Verdana,"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(900px 400px at 110% -10%,rgba(192,38,211,.08),transparent 60%),
               radial-gradient(800px 420px at -10% 0%,rgba(124,58,237,.08),transparent 60%),var(--lilac);
    color:var(--ink);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .head-in{max-width:840px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem}
  .logo .dot{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 210deg,var(--brand1),var(--brand2),var(--brand1));box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 7px rgba(124,58,237,.35)}
  .logo b{background:linear-gradient(90deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .head-btns{margin-left:auto;display:flex;gap:.5rem}
  .hbtn{border:1.5px solid var(--line);background:#fff;color:var(--purple-dark);font-weight:700;font-size:.92rem;padding:.5rem .85rem;border-radius:999px;cursor:pointer}
  .hbtn:hover{border-color:var(--brand2)}
  main{flex:1;width:100%;max-width:840px;margin:0 auto;padding:1.4rem 1rem 3rem}
  footer{border-top:1px solid var(--line);background:#fff}
  .foot-in{max-width:840px;margin:0 auto;padding:.9rem 1rem;font-size:.95rem;color:var(--ink-soft)}
  .foot-in b{color:var(--ink)}
  /* home */
  .hero{padding:1.2rem 0 .9rem}
  .hero h1{font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1.15;font-weight:800}
  .hero h1 span{background:linear-gradient(90deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin-top:.6rem;color:var(--ink-soft);max-width:58ch;font-size:1.05rem}
  .featcard{border:2px solid transparent;border-radius:var(--radius);padding:1.1rem 1.1rem 1rem;margin-top:1.1rem;
    background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--brand1),var(--brand2)) border-box;box-shadow:var(--shadow)}
  .featcard h2{font-size:1.25rem}
  .featcard p{color:var(--ink-soft);margin:.35rem 0 .7rem;font-size:.98rem}
  .taskchips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0 .9rem}
  .tchip{border:1.5px solid var(--line);background:#fbf9fe;border-radius:999px;padding:.28rem .75rem;font-size:.85rem;font-weight:700;color:var(--ink-soft);cursor:pointer}
  .tchip:hover{border-color:var(--brand2);color:var(--purple-dark)}
  .tchip.done{border-color:#bfe5cb;background:var(--green-bg);color:var(--green)}
  .pathlist{display:flex;flex-direction:column;gap:.7rem;margin-top:1.2rem}
  .mcard{display:flex;align-items:center;gap:.95rem;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);
    border-radius:var(--radius);padding:.95rem 1rem;cursor:pointer;box-shadow:var(--shadow);transition:.12s;font:inherit;color:inherit}
  .mcard:hover{transform:translateY(-2px);border-color:#cdb6ec}
  .mnum{flex:0 0 46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;color:#fff;
    background:linear-gradient(135deg,var(--brand1),var(--brand2));font-variant-numeric:tabular-nums}
  .mcard.done .mnum{background:var(--green)}
  .mtxt{flex:1;min-width:0}.mtxt h3{font-size:1.05rem;line-height:1.3}.mtxt p{font-size:.92rem;color:var(--ink-soft);margin-top:.1rem}
  .mgo{flex:0 0 auto;color:var(--brand2);font-weight:800;font-size:1.3rem}.mcard.done .mgo{color:var(--green)}
  .home-extra{display:flex;gap:.7rem;margin-top:1.2rem;flex-wrap:wrap}
  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:none;border-radius:999px;cursor:pointer;font:inherit;font-weight:800;
    padding:.8rem 1.4rem;font-size:1.02rem;transition:filter .12s,transform .12s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(90deg,var(--brand1),var(--brand2));color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.35)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--purple-dark)}
  .btn-ghost:hover{border-color:var(--brand2)}
  .btn:disabled{background:#d9d3e6;color:#8b84a3;box-shadow:none;cursor:not-allowed;filter:none}
  /* module steps */
  .crumb{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
  .crumb .back{background:none;border:none;color:var(--brand2);font-weight:800;cursor:pointer;font-size:1rem;padding:.3rem .2rem}
  .crumb .where{color:var(--ink-soft);font-size:.95rem}
  .stepbar{height:9px;background:#e9e2f4;border-radius:99px;overflow:hidden;margin:.3rem 0 1rem}
  .stepbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand1),var(--brand2));border-radius:99px;transition:width .3s}
  .stepmeta{font-size:.92rem;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums}
  .stepcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.3rem 1.2rem;margin-top:.5rem}
  .stepcard h2{font-size:1.32rem;line-height:1.25;margin-bottom:.7rem}
  .stepcard p{margin:.55rem 0;font-size:1.03rem}
  .stepcard ul,.stepcard ol{margin:.55rem 0 .55rem 1.3rem;font-size:1.03rem}
  .stepcard li{margin:.3rem 0}
  .navrow{display:flex;justify-content:space-between;gap:.7rem;margin-top:1.3rem;flex-wrap:wrap}
  .tip,.warn,.note{border-radius:14px;padding:.75rem .9rem;margin:.8rem 0;font-size:.97rem}
  .tip{background:#f4ecff;border:1.5px solid #ddc9f7}
  .warn{background:var(--amber-bg);border:1.5px solid #f3d9a4}
  .note{background:var(--blue-bg);border:1.5px solid #c3d6fb}
  .tip b,.warn b,.note b{display:block;margin-bottom:.15rem}
  kbd.app{display:inline-block;background:var(--purple);color:#fff;border-radius:999px;padding:.08rem .65rem;font-weight:800;font-family:inherit;font-size:.92em;white-space:nowrap}
  kbd.appghost{display:inline-block;background:#fff;border:1.6px solid var(--purple);color:var(--purple-dark);border-radius:999px;padding:.05rem .6rem;font-weight:800;font-family:inherit;font-size:.92em;white-space:nowrap}
  .badge{display:inline-block;border:1.3px solid #b9b2c9;border-radius:5px;padding:0 .32rem;font-size:.72em;font-weight:800;color:var(--ink-soft);background:#fff}
  .launch{margin-top:1rem}
  /* symbol cards & game */
  .pad{border:1.5px solid var(--line);border-radius:16px;background:#fbf9fe;padding:1rem;margin:.9rem 0}
  .pad-title{font-size:.85rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--brand2);margin-bottom:.7rem}
  .symgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:.7rem;margin:.8rem 0}
  .symcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.8rem;display:flex;gap:.7rem;align-items:flex-start}
  .symcard .ic{flex:0 0 44px}.symcard h4{font-size:.98rem}.symcard p{font-size:.9rem;color:var(--ink-soft);margin:.1rem 0 0}
  .game-q{font-weight:800;font-size:1.05rem;margin:.6rem 0;color:var(--purple-dark)}
  .gamerow{display:flex;flex-wrap:wrap;gap:.6rem}
  .gbtn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.6rem;cursor:pointer;width:74px;height:74px;display:flex;align-items:center;justify-content:center;transition:border-color .12s}
  .gbtn:hover{border-color:var(--brand2)}
  .gbtn.right{border-color:var(--green);background:var(--green-bg)}
  .gbtn.wrong{border-color:var(--red);background:var(--red-bg);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
  .game-fb{min-height:1.6rem;font-weight:800;margin-top:.5rem}
  .game-fb.good{color:var(--green)}.game-fb.bad{color:var(--red)}
  /* quiz */
  .qopt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:.8rem .9rem;margin:.5rem 0;font:inherit;font-size:1.02rem;cursor:pointer;color:var(--ink)}
  .qopt:hover{border-color:var(--brand2)}
  .qopt.correct{border-color:var(--green);background:var(--green-bg);font-weight:800}
  .qopt.incorrect{border-color:var(--red);background:var(--red-bg)}
  .qexp{margin-top:.6rem;font-size:.98rem}
  .scorebig{font-size:2.4rem;font-weight:800;background:linear-gradient(90deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  /* cheat sheet */
  .cheat h2{font-size:1.5rem;margin-bottom:.3rem}
  .cheatgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1rem}
  .cheatbox{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.9rem;break-inside:avoid}
  .cheatbox h3{font-size:1rem;color:var(--purple-dark);margin-bottom:.4rem}
  .cheatbox ol,.cheatbox ul{margin-left:1.15rem;font-size:.93rem}
  .cheatbox li{margin:.22rem 0}
  .symline{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.93rem}
  .symline .ic{flex:0 0 30px}
  /* ===== practice tablet (Camascope replica) ===== */
  .coach{position:sticky;top:62px;z-index:15;background:linear-gradient(95deg,var(--brand1),var(--brand2));color:#fff;border-radius:14px;
    padding:.65rem .85rem;display:flex;gap:.6rem;align-items:center;box-shadow:0 8px 20px rgba(124,58,237,.35);margin-bottom:.8rem}
  .coach .cico{font-size:1.35rem}
  .coach .ctxt{flex:1;font-weight:700;font-size:.97rem;line-height:1.35}
  .coach .cbtn{border:none;background:#fff;color:var(--purple-dark);font-weight:800;border-radius:999px;padding:.4rem .9rem;cursor:pointer;font-size:.9rem}
  .tabfr{background:#141026;border-radius:26px;padding:10px;box-shadow:var(--shadow)}
  .tab{background:#fff;border-radius:18px;overflow:hidden;min-height:540px;display:flex;flex-direction:column;position:relative}
  .sbar{display:flex;justify-content:space-between;font-size:.7rem;color:#666;padding:.22rem .7rem;background:#fff}
  .abar{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-bottom:1px solid #eee}
  .burger{font-size:1.3rem;cursor:pointer;padding:.05rem .35rem;border-radius:8px;line-height:1}
  .adot{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 210deg,var(--brand1),var(--brand2),var(--brand1));box-shadow:inset 0 0 0 4px #fff;flex:0 0 22px}
  .ward{font-weight:800;font-size:.92rem}
  .aright{margin-left:auto;display:flex;gap:.7rem;align-items:flex-end}
  .aitem{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;font-size:.58rem;color:var(--ink-soft);font-weight:700}
  .uav{width:20px;height:20px;border-radius:50%;background:var(--purple-dark);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center}
  .filters{display:flex;gap:.32rem;padding:.45rem .6rem;flex-wrap:wrap;border-bottom:1px solid #f1eef7}
  .ftile{border:1.3px solid var(--brand2);color:var(--purple-dark);border-radius:7px;padding:.06rem .45rem;font-size:.68rem;font-weight:800;background:#fff}
  .ftile.sel{background:var(--purple);color:#fff;border-color:var(--purple)}
  .srow{display:flex;align-items:center;gap:.55rem;padding:.35rem .6rem;font-size:.75rem;color:var(--ink-soft);border-bottom:1px solid #f1eef7;font-weight:700}
  .tgl{width:32px;height:17px;border-radius:99px;background:#d9d4e6;position:relative;display:inline-block}
  .tgl::after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .gridwrap{overflow-x:auto;flex:1}
  .marg{display:grid;grid-template-columns:168px repeat(5,minmax(72px,1fr));min-width:600px;font-size:.76rem}
  .gh{background:#efe9f7;padding:.4rem .2rem;text-align:center;font-weight:800;color:var(--ink-soft);font-size:.74rem}
  .gh.cur{background:#7a4bd0;color:#fff}
  .gh.first{background:#fff}
  .rstrip{grid-column:1/-1;font-size:.68rem;font-weight:800;padding:.16rem .6rem}
  .rstrip.sch{background:#fff6e3;color:#8a6100}
  .rstrip.abs{background:#e9ebf1;color:#5a6072}
  .rstrip.skp{background:#ffefe0;color:#b45309}
  .pcell{display:flex;gap:.4rem;padding:.4rem .45rem;border-bottom:1px solid #f4f1fa;background:#fff;align-items:flex-start}
  .pava{width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:#e9def6;display:flex;align-items:center;justify-content:center;color:var(--purple-dark);font-weight:800;font-size:.72rem}
  .pmeta{min-width:0}
  .pname{font-weight:800;color:var(--ink);font-size:.78rem;line-height:1.2}
  .psub{color:var(--ink-soft);font-size:.65rem}
  .ptags{margin-top:.15rem;display:flex;gap:.2rem}
  .proom{margin-left:auto;font-weight:800;font-size:.72rem}
  .cell{border-bottom:1px solid #f4f1fa;border-left:1px solid #f8f5fc;display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.3rem .15rem;background:#fff;flex-wrap:wrap}
  .cell.cur{background:#f3edfa}
  .cell.tap{cursor:pointer}
  .cico{position:relative;display:inline-flex}
  .cico .n{position:absolute;right:-7px;bottom:-4px;font-size:.6rem;font-weight:800}
  .pulse{outline:3px solid #e11dc0;outline-offset:2px;animation:pul 1.3s infinite;border-radius:12px}
  @keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(225,29,192,.5)}55%{box-shadow:0 0 0 10px rgba(225,29,192,0)}}
  /* login screens */
  .lg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2rem;gap:.5rem}
  .lg .biglogo{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:1.1rem;margin-bottom:.4rem}
  .lg h3{font-size:1.5rem;line-height:1.25;font-weight:800}
  .lg h3 .pk{color:var(--brand1)}
  .lg .cap{font-size:.72rem;color:var(--ink-soft)}
  .lg .lfld{width:min(260px,100%);text-align:left}
  .lg .lfld label{font-size:.72rem;font-weight:800;color:var(--ink-soft)}
  .lg input,.lg select{width:100%;border:1.6px solid var(--line);border-radius:10px;padding:.55rem .65rem;font:inherit;font-size:.95rem}
  .lg input:focus,.lg select:focus{outline:3px solid #e6d6fb;border-color:var(--brand2)}
  .pill{background:var(--purple);color:#fff;border:none;border-radius:999px;padding:.55rem 1.6rem;font-weight:800;font-size:.95rem;cursor:pointer}
  .pill:disabled{background:#d9d3e6;color:#928aa9;cursor:not-allowed}
  .radios{width:min(260px,100%);text-align:left;font-size:.9rem}
  .radios label{display:flex;gap:.5rem;align-items:center;padding:.3rem 0;font-weight:700;cursor:pointer}
  .homeicons{flex:1;background:#14102a;display:flex;align-items:center;justify-content:center;gap:2rem;border-radius:0 0 18px 18px}
  .hicon{text-align:center;color:#cfc8e8;font-size:.72rem;font-weight:700;cursor:pointer;padding:.5rem;border-radius:14px}
  .hicon .sq{width:58px;height:58px;border-radius:14px;margin:0 auto .3rem;display:flex;align-items:center;justify-content:center;background:#fff}
  .hicon.old .sq{background:#241d44}
  .hicon .ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 210deg,#f0abfc,#a855f7,#f0abfc);box-shadow:inset 0 0 0 6px rgba(255,255,255,.92)}
  .hicon.old .ring{box-shadow:inset 0 0 0 6px rgba(20,16,42,.92)}
  .spin{width:34px;height:34px;border:4px solid #e6ddf2;border-top-color:var(--brand2);border-radius:50%;animation:sp 1s linear infinite;margin:.6rem auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* person view */
  .pv{display:flex;flex:1;min-height:0}
  .pv-left{flex:0 0 178px;border-right:1px solid #f0ecf7;padding:.55rem .6rem;font-size:.75rem;overflow:auto}
  .pv-back{cursor:pointer;font-weight:800;color:var(--ink-soft);font-size:1rem;display:inline-block;padding:.05rem .4rem;border-radius:8px}
  .pv-name{font-weight:800;font-size:.85rem;margin-top:.15rem}
  .bigava{width:110px;height:110px;border-radius:12px;margin:.5rem auto;background:#e9def6;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph{color:var(--purple-dark);font-weight:800;margin-top:.5rem;font-size:.76rem}
  .pv-right{flex:1;display:flex;flex-direction:column;min-width:0}
  .ptabs{display:flex;gap:.9rem;padding:.45rem .8rem;border-bottom:1px solid #eee;font-weight:700;color:var(--ink-soft);font-size:.8rem}
  .ptabs .cur{color:var(--ink);border-bottom:3px solid var(--purple-dark);padding-bottom:.15rem}
  .medlist{flex:1;overflow:auto;padding:.4rem .55rem .2rem}
  .mc{border:1px solid #eee;border-radius:10px;margin:.45rem 0;overflow:hidden;background:#fff}
  .mstrip{display:flex;justify-content:space-between;align-items:center;font-size:.65rem;font-weight:800;padding:.14rem .5rem}
  .mstrip.pend{background:#fff6e3;color:#8a6100}
  .mstrip.take{background:#e7f6ec;color:var(--green)}
  .mstrip.skp{background:#ffefe0;color:#b45309}
  .mstrip.prn{background:#e9f0fe;color:var(--blue)}
  .mstrip .stk{color:var(--ink-soft);font-weight:700}
  .mbody{padding:.35rem .55rem .5rem}
  .mn{font-weight:800;font-size:.82rem}
  .mi{font-size:.7rem;color:var(--ink-soft)}
  .mline{display:flex;align-items:center;gap:.4rem;margin-top:.25rem;font-size:.66rem;flex-wrap:wrap}
  .lchip{background:#2f6fed;color:#fff;border-radius:4px;padding:.03rem .32rem;font-weight:800}
  .lchip.red{background:#dc2626}
  .okgreen{color:var(--green);font-weight:800}
  .moreinfo{margin-left:auto;color:var(--blue);font-weight:800;font-size:.68rem;cursor:pointer;white-space:nowrap}
  .fchip{border:1.4px solid #2f6fed;color:#2f6fed;border-radius:5px;padding:.02rem .32rem;font-weight:800;cursor:pointer;background:#fff}
  .fchip.doneflag{border-color:#bfe5cb;color:var(--green);cursor:default}
  .prndiv{display:flex;justify-content:center;margin:.5rem 0 .2rem}
  .prndiv span{border:1.5px solid var(--blue);color:var(--blue);font-weight:800;font-size:.7rem;border-radius:6px;padding:.05rem .5rem;background:#fff}
  .pbot{display:flex;gap:.55rem;padding:.5rem .6rem;border-top:1px solid #eee}
  .abtn{flex:1;border-radius:999px;padding:.5rem;font-weight:800;font-size:.82rem;cursor:pointer;border:none}
  .abtn.outline{background:#fff;border:1.6px solid var(--purple);color:var(--purple-dark)}
  .abtn.solid{background:var(--purple);color:#fff}
  .abtn:disabled{background:#e2d9f1;color:#9d92b8;border:none;cursor:not-allowed}
  /* sheets & drawer */
  .sheet{position:absolute;inset:0;background:rgba(24,16,48,.38);display:flex;align-items:flex-end;justify-content:center;z-index:6}
  .shcard{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:.75rem .85rem .95rem;font-size:.85rem}
  .shcard h4{text-align:center;font-size:.98rem}
  .shcard .mand{text-align:center;font-size:.68rem;color:var(--blue);margin-bottom:.5rem;font-weight:700}
  .fld{margin:.5rem 0}
  .fld label{display:block;font-weight:800;font-size:.76rem;margin-bottom:.18rem}
  .fld label .req{color:var(--red)}
  .fld input,.fld select,.fld textarea{width:100%;border:1.6px solid var(--line);border-radius:10px;padding:.5rem .6rem;font:inherit;font-size:.9rem;background:#fff;color:var(--ink)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid #e6d6fb;border-color:var(--brand2)}
  .fld .hint{font-size:.7rem;color:var(--ink-soft);margin-top:.12rem}

function todayStr(){const d=new Date(),m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return String(d.getDate()).padStart(2,"0")+"-"+m[d.getMonth()]+"-"+d.getFullYear()}
function dayStr(){const d=new Date(),w=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return w[d.getDay()]+", "+d.getDate()+" "+m[d.getMonth()]}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}
function nudge(m){toast(m||"Follow the pink highlight 💜")}

function takeMed(){
 const id=S.sel,m=MEDS[id];
 const d=parseFloat(S.doses[id]);
 if(!(d>0)){nudge("Type the dosage — e.g. "+m.dose);return}
 if(id==="preg"&&!S.witness){nudge("A witness first — tap Add Witness 💜");return}
 if(id==="para"&&(S.notes.para||"").trim().length<5){nudge("The why-note is compulsory — type it in your own words");return}
 const exp=parseFloat(m.dose);
 if(d!==exp)toast("Prescribed is "+m.dose+" — you entered "+S.doses[id]+". Always double-check! (Recorded for practice)");
 const w=S.witness;
 S.st[id]="taken";S.times[id]=nowT();S.rec[id]={dose:S.doses[id],note:(S.notes[id]||"").trim(),wit:w};
 S.witness="";S.sel=null;S.panel=null;
 if(id==="asp"){doneTask(2);S.phase="tapPreg";if(d===exp)toast("✓ Aspirin signed as taken — green, with your name and time")}
 if(id==="preg"){doneTask(3);S.phase="tapRam";if(d===exp)toast("✓ CD recorded — your name and "+w+"'s both in the history")}
 if(id==="para"){S.phase="flag";if(d===exp)toast("✓ PRN recorded with your note — now spot the ⚑ flag")}
 render();
}

const PORTAL_MODULES=[
{ title:"Portal: what it is & logging in", blurb:"The office website behind the app — same login, browser-based.", steps:[
 {t:"The other half of Camascope", h:`
   <p>The tablet app is for <b>giving</b> medicines. The <b>Camascope Portal</b> is the website on the office computer where everything is <b>set up and managed</b> — ordering, checking in deliveries, stopping medicines, running reports and printing MAR charts. Everything done on the Portal appears live on the app, and everything done on the app is visible on the Portal.</p>
   <p>The address is <b>https://emar.vcaresystems.co.uk</b> — and your <b>username and password are the same</b> as the app.</p>
   <ol><li>Open the address in the browser.</li><li>On “Choose an account”, click <b>Another User</b> (never someone else's saved account).</li><li>Username → Sign In → password → Sign In — the same two-part login as the tablet.</li></ol>
   <p>When you finish: click your <b>initials</b> (top-right) → <kbd class="app">Sign out</kbd>.</p>
   <div class="launch"><button class="btn btn-primary" onclick="pSimStart(0)">💻 Practise logging in to the Portal</button>
   <button class="btn btn-ghost" onclick="pSimStart(8)">💻 Practise signing out</button></div>`}
]},
{ title:"Portal: your dashboard at a glance", blurb:"Live totals from the rounds, and the panels that need action.", steps:[
 {t:"The tiles", h:`
   <ul>
    <li><b>Service Users</b> — active people, and how many are marked absent (hospital or leave).</li>
    <li><b>Missed</b> — medication with <b>no signature at all</b>. These need chasing.</li>
    <li><b>Delayed</b> — given, but later than the round time.</li>
    <li><b>Skipped</b> — not given, with a reason (e.g. refused).</li>
    <li><b>PRN Admins</b> — when-required medicines given · <b>Follow Ups</b> — follow-ups completed.</li>
   </ul>`},
 {t:"The panels", h:`
   <ul>
    <li><b>Pending Check-In</b> — medicines the pharmacy has sent, waiting to be checked in (with a count per person).</li>
    <li><b>Medication Alerts</b> — a person with <b>two medicines sharing an ingredient</b> (potential clash), plus stopped/stopping items.</li>
    <li><b>Missed Actions [48 Hrs]</b> — missing signatures and missed follow-ups from the last two days only.</li>
    <li><b>Service User Status</b> — who's marked on leave or no longer in the home.</li>
    <li><b>Stock Alerts</b> — negative figures, low stock, and stopped medicines still holding stock.</li>
   </ul>
   <div class="note"><b>ℹ More than one home?</b> The <b>Account Dashboard</b> (Dashboards tab) shows an overview of every home you have access to, and you can open each from the list.</div>
   <div class="launch"><button class="btn btn-primary" onclick="pSimStart(1)">💻 Take the dashboard tour</button></div>`}
]},
{ title:"Portal: passwords & your witness PIN", blurb:"Passwords change here only — and the PIN that lets you witness.", steps:[
 {t:"Changing your password", h:`
   <p>Passwords can <b>only</b> be changed on the Portal — the new one then works for the app too. Click your <b>initials</b> → <b>Manage account</b> → <b>Password</b>. You'll need your current password, and the new one must have: <b>8+ characters, an uppercase letter, a lowercase letter, a number, a special character</b>, and differ from the old one.</p>
   <p><b>Password Recovery Method</b> — set up Email, Mobile or an Authenticator app so a reset can reach you if it's ever forgotten (a verification code confirms it). The <b>Authenticator App</b> option shows 3 steps and a QR code to scan.</p>`},
 {t:"Your witness PIN (Secondary Pin)", h:`
   <p>The witness PIN lets you <b>witness on the tablet without typing your whole password</b> every time — it's only ever used for witnessing.</p>
   <ol><li>Initials → <b>Manage account</b> → <b>Secondary Pin</b> (it says <i>Pending Setup</i> until done).</li>
   <li>Type a PIN of <b>6–12 digits</b>, re-enter it, press <kbd class="app">Setup</kbd>.</li></ol>
   <p>It can be reset any time with the same steps.</p>
   <div class="launch"><button class="btn btn-primary" onclick="pSimStart(2)">💻 Practise setting your PIN</button></div>`}
]},
{ title:"Portal: checking in a medicine delivery", blurb:"The big weekly job — Verify, review the five tabs, Check-in.", steps:[
 {t:"Where and what", h:`
   <p><b>Medication ▾ → Check-Ins</b>. People with a number next to their name have items waiting. Click the person and the pharmacy's data appears with four tabs: <b>Dispensed Medications</b> (sent by pharmacy) · <b>Adhoc Medications</b> (created in the home) · <b>Checked-in Medications</b> · <b>Ignored/Rejected</b>.</p>
   <p>Each row shows <b>Clashes If Any</b>, <b>Order Qty</b> and an editable <b>Dispensed Qty</b> — check it against the boxes in your hand. Then: <kbd class="app">Verify</kbd> to review, <b>Resolve</b> if there's a clash, <b>Reject</b> to send back for the pharmacy to correct and resend, or <b>Ignore</b> if it's genuinely not needed (ignored data can't be resent).</p>`},
 {t:"The review screen — five tabs", h:`
   <ul>
    <li><b>Brand/Generic</b> — how it was dispensed vs how it was last checked in.</li>
    <li><b>Medication</b> — name, new/existing, dosage instructions, quantity delivered.</li>
    <li><b>Schedule</b> — the times sent by pharmacy; editable. A <b>Schedule Clash</b> shows the Current and New cycles side by side: <b>Continue Existing</b> keeps yours, <b>Change to New Schedule</b> starts the new one next cycle.</li>
    <li><b>Settings</b> — the tickboxes that make it behave: <b>Long Term</b> (carries to every monthly cycle) · <b>Administration Managed</b> (appears on the app — untick for self-administering) · <b>Stock Counted</b> (untick creams/drops) · <b>Covert</b> · <b>High Risk</b> (witness, not quite a CD) · <b>PRN</b> · <b>Controlled Drug</b> (witness) · <b>Pain Level on eMAR</b> · <b>QR Code Enabled</b> — plus Medicated/Non-Medicated Topical and a follow-up interval.</li>
    <li><b>Warnings</b> — ingredient/brand clashes (e.g. Laxido vs Macrogol — same ingredient, different brand): stop one, start the other, and sort the stock.</li>
   </ul>
   <p>Then <kbd class="app">Check-in</kbd> — a success pop-up confirms and it moves to the Checked-in tab.</p>
   <div class="launch"><button class="btn btn-primary" onclick="pSimStart(3)">💻 Practise a full check-in + clash</button></div>`}
]},
{ title:"Portal: adding a medicine manually (Adhoc)", blurb:"Interims and new residents — when there's no pharmacy data.", steps:[
 {t:"Add New Medicine", h:`
   <ol><li>On the person's Check-Ins page, press <kbd class="app">Add New Medicine</kbd>.</li>
   <li><b>Free-type the name</b> from the dispensing label until the right entry appears, and pick it.</li>
   <li>Type the quantity into <b>Dispensed Qty</b>, then press <kbd class="app">Setup</kbd>.</li>
   <li>The <b>Schedule Pattern</b> window opens: type the <b>Dosage Instructions</b> from the label, set Start and End dates, the Frequency, and each <b>Round time + Dosage</b> (Add Round / Add PRN for more). <kbd class="app">Save</kbd>.</li>
   <li>Back on the check-in page — review and <kbd class="app">Check-in</kbd>. It's now live on the tablet.</li></ol>
   <div class="launch"><button class="btn btn-primary" onclick="pSimStart(4)">💻 Practise adding a medicine</button></div>`}
]},
{ title:"Portal: editing & stopping schedules", blurb:"GP changes happen here — always with a note.", steps:[
 {t:"Editing", h:`
   <p>If a GP changes a dose or time, it can <b>only</b> be edited on the Portal: <b>Medication ▾ → Schedule</b> → pick the person → click the medicine → <kbd class="app">Edit Schedule</kbd>.</p>
   <p>Fill in: <b>Dosage Instructions</b> (as the GP/label says) · <b>Notes — mandatory</b>, explaining why · Start/End dates (usually the cycle end) · Frequency &amp; Repeats · each <b>Round + Dosage</b>. It will not save without the note.</p>`},
 {t:"Stopping — one or many", h:`
   <ol><li>On the medicine's Schedule page, click <kbd class="app">⊘ Stop</kbd>.</li>
   <li>Choose the stop date and time, type the <b>note</b> (why), and say where the stock goes: <b>Returned</b> to pharmacy or <b>Destroyed</b>.</li>
   <li><kbd class="app">Amend Stock and Stop</kbd>.</li></ol>
   <div class="tip"><b>💜 Stopping everything?</b> <b>Bulk actions → Stop Medications</b> lists all of them pre-ticked — untick any that continue, set the date, note, and Returned/Destroyed per item.</div>

{ title:"Portal: reorders, stock & audits", blurb:"The monthly order, moving stock, and keeping counts honest.", steps:[

   <ol><li><b>Medication ▾ → Repeat Requests</b> → pick the person.</li>

   <p><b>Medication ▾ → Stock</b> → pick the medicine. All its activity shows. Click <kbd class="app">Amend</kbd>:</p>
   <ul><li>Boxes are <b>S</b> (shelf) and <b>T</b> (trolley), under <b>Other · Returned · Lost · Destroyed</b>.</li>

/* symbol game */
const GAME=[
 {ask:"Tap the symbol that means the medicine is due right now.",key:"due"},
 {ask:"Tap the symbol for a medicine already given and signed.",key:"taken"},
 {ask:"Tap the symbol that means missed — nothing recorded.",key:"missed"},
 {ask:"Tap the symbol for a skipped medicine (with a reason).",key:"skip"},
 {ask:"Tap the symbol for scheduled — but not due yet.",key:"sched"},
 {ask:"Tap the symbol for “when required” medicines.",key:"prn"}];
let gi=0;
function initGame(){gi=0;
 const keys=["taken","due","sched","skip","missed","prn"].sort(()=>Math.random()-.5);
 document.getElementById("grow").innerHTML=keys.map(k=>`<button class="gbtn" data-k="${k}" onclick="gamePick(this)" aria-label="${k}">${IC[k](44)}</button>`).join("");
 gameAsk()}
function gameAsk(){const q=document.getElementById("gq");if(!q)return;
 if(gi<GAME.length){q.textContent=(gi+1)+" of "+GAME.length+" — "+GAME[gi].ask;
  const f=document.getElementById("gfb");f.textContent="";f.className="game-fb"}
 else{q.textContent="🎉 All six — you know your symbols!";
  const f=document.getElementById("gfb");f.className="game-fb good";f.textContent="That grid will make sense at a glance now."}}
function gamePick(btn){if(gi>=GAME.length)return;
 const fb=document.getElementById("gfb");
 document.querySelectorAll(".gbtn").forEach(b=>b.classList.remove("right","wrong"));
 if(btn.dataset.k===GAME[gi].key){btn.classList.add("right");fb.className="game-fb good";fb.textContent="✓ Spot on!";gi++;setTimeout(gameAsk,750)}
 else{btn.classList.add("wrong");fb.className="game-fb bad";fb.textContent="Not that one — try again."}}
